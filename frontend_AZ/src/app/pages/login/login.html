<div class="login-fondo">
    <section class="login-card">
        <div class="login-logo">
            <div class="logo-login">🛠</div>
            <h1>AZ HELP DESK</h1>
            <p>Gestión inteligente de soporte TI</p>
        </div>
        
        <form>
            <div class="campo-login">
                <label>📧 Correo electrónico</label>
                <input type="email" [(ngModel)]="correo" name="correo" placeholder="ejemplo@gmail.com" autocomplete="off" required>
            </div>

            <div class="campo-login">
                <label> 🔒 Contraseña</label>
                <input type="password" [(ngModel)]="password" name="password" placeholder="Ingrese su contraseña" autocomplete="new-password" required>
            </div>

            <div class="alert-login" *ngIf="mensaje"> ⚠ {{mensaje}} </div>
            <button  type="button" class="boton-login" (click)="ingresar()"> Ingresar </button>
            <p class="texto-registro"> ¿No tienes una cuenta? <a routerLink="/registro"> Regístrate </a></p>
        </form>
    </section>
</div>
