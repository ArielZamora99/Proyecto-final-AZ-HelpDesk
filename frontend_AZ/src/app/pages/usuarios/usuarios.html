<header class="barra">
    <h1>Administración de Usuarios</h1>
    <p>Gestión de clientes, técnicos y administradores</p>
</header>

<nav class="nav">
    <ul>
        <li> <a routerLink="/dashboard">🏠 Inicio</a></li>
    </ul>
</nav>

<main>
    <section class="card" style="margin-bottom:10px;">
        <h2>Nuevo Usuario</h2>
        
        <div class="fila">
            <div class="campo"><label>Nombres</label>  <input [(ngModel)]="nombres"> </div>
            <div class="campo"><label>Apellidos</label><input [(ngModel)]="apellidos"> </div>
        </div>

        <div class="fila">
            <div class="campo"><label>Correo</label><input type ="email" [(ngModel)]="correo" autocomplete="off"> </div>
            <div class="campo"><label>Contraseña</label><input type="password" [(ngModel)]="password_hash" autocomplete="new-password"></div>
        </div>

        <div class="fila">
            <div class="campo"><label>Teléfono</label><input [(ngModel)]="telefono"></div>
            <div class="campo"><label>Rol</label>
                <select [(ngModel)]="id_rol">
                    <option value="1">Administrador</option>
                    <option value="2">Técnico</option>
                    <option value="3">Cliente</option>
                </select></div>
        </div>
        
        <button class="boton primario" (click)="guardarUsuario()"> Guardar Usuario </button>
    </section>
    
    <section class="card">
        <h2>Usuarios registrados</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let usuario of usuarios">
                    <td>{{usuario.id_usuario}}</td>
                    <td>{{usuario.nombres}}{{usuario.apellidos}}</td>
                    <td>{{usuario.correo}}</td>
                    <td>{{usuario.rol}}</td>
                    <td>
                        <button class="boton primario" (click)="editar(usuario)"> Editar </button>
                        <button class="boton peligro"  (click)="eliminar(usuario.id_usuario)"> Eliminar </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
</main>
<footer class="footerSistema">
    <p>Autor: Ariel Zamora</p>
</footer>
