<div class="registro-fondo">
    <section class="registro-card">
        <div class="registro-header">
            <div class="logo-registro"> 🛠</div>
            <h1>Crear cuenta</h1>
            <p>Únete al sistema AZ Help Desk</p>
        </div>
        
        <form autocomplete="off">
            <div class="fila-registro">
                <div class="campo-registro">
                    <label>👤 Nombres</label>
                    <input type="text"[(ngModel)]="nombres"name="nombres"placeholder="Ingrese sus nombres">
                </div>

                <div class="campo-registro">
                    <label>👤 Apellidos</label>
                    <input type="text" [(ngModel)]="apellidos" name="apellidos" placeholder="Ingrese sus apellidos">
                </div>
            </div>

            <div class="campo-registro">
                <label>📧 Correo electrónico</label>
                <input type="email" [(ngModel)]="correo"  name="correo" placeholder="ejemplo@gmail.com" autocomplete="email" required> 
            </div>

            <div class="campo-registro">
                <label>📱 Teléfono</label>
                <input type="text" [(ngModel)]="telefono" name="telefono" placeholder="Ingrese su teléfono" autocomplete="off">
            </div>

            <div class="fila-registro">
                <div class="campo-registro">
                    <label> 🔒 Contraseña </label>
                    <input type="password" [(ngModel)]="password" name="password" placeholder="Ingrese su contraseña" autocomplete="new-password" required>
                </div>

                <div class="campo-registro">
                    <label> 🔐 Confirmar contraseña</label>
                    <input type="password" [(ngModel)]="confirmarPassword" name="confirmarPassword" placeholder="Repita contraseña">
                </div>
            </div>

            <div class="alert-registro" *ngIf="mensaje"> ⚠ {{mensaje}} </div>
            <button type="button" class="boton-registro" (click)="registrar()"> Crear cuenta </button>
            <p class="texto-login"> ¿Ya tienes una cuenta? <a routerLink="/login"> Iniciar sesión </a> </p>
        </form>
    </section>
</div>
